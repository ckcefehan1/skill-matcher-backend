global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: skill-matcher-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      # keep in sync with ACTUATOR_PASSWORD on the backend
      password: prometheus-dev-password
    # Backend runs on host via bootRun, not in compose
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: rabbitmq
    # rabbitmq_prometheus plugin, enabled by default in the management image
    static_configs:
      - targets:
          - rabbitmq:15692
