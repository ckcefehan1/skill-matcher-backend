# Test-only JWT keys
jwt.public-key=classpath:keys/jwt-public.pem
jwt.private-key=classpath:keys/jwt-private.pem
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=skill-matcher-backend-test
jwt.refresh-token-secret=test-refresh-token-secret

# Generous limits so integration tests never hit the bucket
rate-limit.login-per-minute=10000
rate-limit.password-reset-per-minute=10000
rate-limit.invitation-per-minute=10000
rate-limit.refresh-per-minute=10000
rate-limit.ws-ticket-per-minute=10000

# No broker in tests
mail.rabbitmq.enabled=false
chat.rabbitmq.enabled=false

# No RabbitMQ in CI/test env, keep /health UP
management.health.rabbit.enabled=false
management.health.mail.enabled=false

cookie.secure=false
