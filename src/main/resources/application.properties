spring.application.name=skill-matcher-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/skillmatcher
spring.datasource.username=skillmatcher
spring.datasource.password=skillmatcher

spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:db/db.changelog-master.xml

jwt.public-key=classpath:keys/jwt-public.pem
jwt.private-key=classpath:keys/jwt-private.pem
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=skill-matcher-backend
jwt.refresh-token-secret=${REFRESH_TOKEN_SECRET:YWhlYWRwcm9ncmVzc2luZGVlZHNlZW1zbm9pc2VyZWFsaXplY2FrZW9uY2Vib3R0bGU=}

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

mail.from=noreply@skill-matcher.local
mail.base-url=http://localhost:5173
mail.smtp.enabled=true
# Mail via RabbitMQ (needs docker compose rabbitmq). Falls back to direct @Async SMTP when false.
mail.rabbitmq.enabled=true

invitation.token-expiration-hours=72

password-reset.token-expiration-hours=24

matching.must-have-coverage-threshold=0.6
matching.capacity-mode=SOFT
matching.capacity-penalty=0.15
matching.ml-enabled=false
matching.ml-weight=0.3

matching.skill-graph.enabled=true
matching.skill-graph.min-co-occurrence=5
matching.skill-graph.derivation-enabled=true
matching.skill-graph.min-transfer-penalty=0.5

spring.data.web.pageable.max-page-size=100

rate-limit.login-per-minute=5
rate-limit.password-reset-per-minute=5
rate-limit.invitation-per-minute=10
rate-limit.refresh-per-minute=30
# one ticket per (re)connect, stompjs reconnects every 5s at worst
rate-limit.ws-ticket-per-minute=30

login-lockout.max-failed-attempts=5
login-lockout.lockout-duration-minutes=15

cache.skill-catalog-ttl=1h
cache.skill-catalog-max-size=500
cache.matching-ttl=60s
cache.matching-max-size=1000

rabbitmq.exchange=skill-matcher.events
rabbitmq.mail-queue=mail.send
rabbitmq.mail-dlq=mail.send.dlq
rabbitmq.mail-routing-key=mail.send
rabbitmq.chat-queue=chat.events
rabbitmq.chat-dlq=chat.events.dlq
rabbitmq.retry.max-retries=2
rabbitmq.retry.initial-interval-ms=1000
rabbitmq.retry.multiplier=2.0
rabbitmq.retry.max-interval-ms=5000

# Chat delivery via RabbitMQ (needs docker compose rabbitmq). Falls back to direct WebSocket push when false.
chat.rabbitmq.enabled=true

ws-ticket.ttl=60s
ws-ticket.max-size=10000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# set COOKIE_SECURE=true in prod (requires TLS, see HSTS note in SecurityConfig)
cookie.secure=${COOKIE_SECURE:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
