services:
  postgres:
    image: postgres:18.1
    container_name: skill-matcher-db
    environment:
      POSTGRES_DB: skillmatcher
      POSTGRES_USER: skillmatcher
      POSTGRES_PASSWORD: skillmatcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  mailhog:
    image: mailhog/mailhog:latest
    container_name: skill-matcher-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: skill-matcher-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: skill-matcher-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.0.2
    container_name: skill-matcher-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
